services:
  node:
    container_name: dev
    build:
      context: .
      target: development
    volumes:
      - ./sc:/app/sc:ro
    ports:
      - "100:4000"
    environment:
      - Type=ديففففففففف
      - name=Dev
      - PGHOST=postgres
      - PGUSER=postgres
      - PGPASSWORD=password
      - PGDATABASE=mydb
    depends_on:
      - postgres
    command: npm run start-dev

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  
