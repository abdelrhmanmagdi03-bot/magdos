services:
  node:
    container_name: nodes
    build:
      context: .
      target: production
    image: amffahmi/magdoos:V2
    env_file:
      - ./.var
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: example
    volumes:
      - datastore:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./templates:/etc/nginx/templates
    ports:
      - "8080:80"
    environment:
      - NGINX_HOST=foobar.com
      - NGINX_PORT=80
    depends_on:
      - node

volumes:
  datastore:
