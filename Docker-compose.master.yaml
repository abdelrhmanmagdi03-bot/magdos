 node:
  container_name: nodes
  build: .  
  image: amffahmi/magdoos:V2
  env_file:
   - ./.var 
  depends_on:
   - postgres
 postgres:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: example
      #POSTGRES_DB: mydb
    volumes:
      - datastore:/var/lib/postgresql

 
